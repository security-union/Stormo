name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs stop immediately — rapid push cadence must not stack
# billed macOS runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test strategy (design doc DD-6):
#   Tier 1 (engine, sans-I/O) + Tier 2 (loopback QUIC integration) run here on
#   every commit. Tier 3 (AWDL/peer-to-peer Wi-Fi hardware matrix) is a
#   release gate on the physical device lab and is NOT represented here.
#
# Cost notes (macOS bills at 10x Linux):
#   - The E2E script runs as a step of the macOS job — it reuses .build
#     instead of paying a second macOS runner for a duplicate compile.
#   - FlatBuffers drift runs on Linux: flatc + diff needs no Apple frameworks.
#   - Mac Catalyst runs on main pushes only; the iOS Simulator job is the
#     PR-time floor/destination check (it is the one that catches
#     availability-floor breaks).

jobs:
  # Fast loop: native macOS via SwiftPM, with coverage (QA-8 ≥ 85% non-radio),
  # then the cross-process Bonjour+QUIC E2E on the same build products.
  macos-native:
    name: macOS (swift test + coverage + E2E)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
        env:
          QUIC_DEBUG: "1"
          QUIC_DEBUG_LOG: /tmp/quic-debug.log
          # Same-machine runs need p2p off (failure mode 10). Peer-to-peer
          # Wi-Fi coverage is tier 3 (hardware lab) by design.
          PEERMESH_NO_P2P: "1"
      - name: Diagnostics on failure (QUIC log + crash reports)
        if: failure()
        run: |
          tail -200 /tmp/quic-debug.log 2>/dev/null || true
          sleep 5 # ReportCrash writes .ips asynchronously
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "=== $f ==="; head -120 "$f"
          done
      - name: Export coverage summary
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROF="$BIN_PATH/codecov/default.profdata"
          XCTEST=$(find "$BIN_PATH" -name '*.xctest' | head -1)
          xcrun llvm-cov report "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            -instr-profile "$PROF" -ignore-filename-regex '(Tests|Generated)/' || true
      # Tier 2.5: cross-process exchange over the production Bonjour+QUIC
      # path — the rung that caught the FIN and inbound-retention bugs.
      # Reuses this job's .build (the script's `swift build` is incremental).
      - name: Cross-process Bonjour+QUIC E2E
        run: ./Scripts/e2e-cli.sh
        env:
          QUIC_DEBUG: "1"
          PEERMESH_NO_P2P: "1"

  # Same test bundle per Apple destination. iOS Simulator runs on PRs (the
  # availability-floor check); Mac Catalyst only on pushes to main.
  platform-matrix:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: auto-ios # resolved at runtime against the runner's simulators
    steps:
      - uses: actions/checkout@v4
      - name: Resolve destination
        id: dest
        run: |
          if [ "${{ matrix.destination }}" = "auto-ios" ]; then
            # Pick the first available iPhone simulator on this runner image —
            # resilient to Xcode image updates renaming devices.
            UDID=$(xcrun simctl list devices available --json \
              | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
            echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          else
            echo "destination=${{ matrix.destination }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PeerMesh-Package \
            -destination '${{ steps.dest.outputs.destination }}' \
            | grep -vE '^\s*$' | tail -50

  mac-catalyst:
    name: Mac Catalyst
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PeerMesh-Package \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            | grep -vE '^\s*$' | tail -50

  # DD-5 rule 4: committed generated code must match the pinned flatc output.
  # Linux runner: flatc + diff needs no Apple frameworks, and macOS bills 10x.
  flatbuffers-drift:
    name: FlatBuffers codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned flatc
        # Exact-version pin rule (CLAUDE.md): flatc MUST equal the FlatBuffers
        # runtime pinned in Package.swift.
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.2.10/Linux.flatc.binary.clang++-18.zip
          unzip -o /tmp/flatc.zip -d /tmp/flatc-bin
          /tmp/flatc-bin/flatc --version | grep -F '25.2.10'
      - name: Regenerate and diff
        run: |
          /tmp/flatc-bin/flatc --swift -o /tmp/generated Schemas/*.fbs
          diff -r /tmp/generated Sources/PeerMeshProtocol/Generated \
            || { echo '::error::Generated sources drifted from schemas (DD-5 rule 4)'; exit 1; }

# TODO(S-6): nightly workflow_dispatch job — stream-churn benchmark and 32-peer
# mesh simulation with timing budgets (QA-2, QA-8).
